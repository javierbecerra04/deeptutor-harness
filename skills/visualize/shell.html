<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --blue: #0969da; --green: #1a7f37; --coral: #c4432b; --amber: #9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --blue: #58a6ff; --green: #3fb950; --coral: #ff7b72; --amber: #d29922; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  svg .t { font-size: 14px; fill: var(--fg); }
  svg .th { font-size: 14px; font-weight: 600; fill: var(--fg); }
  svg .ts { font-size: 12px; fill: var(--muted); }
  svg .box { fill: none; stroke: var(--line); }
  svg .arr { stroke: var(--muted); fill: none; }
  svg .c-blue { stroke: var(--blue); } svg .c-green { stroke: var(--green); }
  svg .c-coral { stroke: var(--coral); } svg .c-amber { stroke: var(--amber); }
</style>
</head>
<body>
<main>
<h1>TITLE</h1>
<!-- BODY: one inline <svg>, one <canvas> with its Chart.js script, one <pre class="mermaid">, or the interactive widget. -->
</main>
</body>
</html>
